name: Supabase Free Tier Keepalive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (9:30 AM IST) to prevent project pausing (Supabase pauses after 7 days)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keepalive read request to Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning ::VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secret is not set. Skipping ping."
            exit 0
          fi

          echo "Pinging Supabase REST API endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/notices?select=id&limit=1")

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "✅ Supabase project pinged successfully! Database activity recorded."
          else
            echo "::warning ::Unexpected status code $HTTP_STATUS from Supabase endpoint."
          fi
