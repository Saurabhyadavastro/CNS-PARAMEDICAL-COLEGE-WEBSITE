<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="60%" stop-color="#101e42" />
      <stop offset="100%" stop-color="#070c1e" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169e1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#347fe1" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4169e1" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />

  <!-- Ambient Light Circles -->
  <circle cx="200" cy="200" r="280" fill="#4169e1" fill-opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="600" r="320" fill="#347fe1" fill-opacity="0.1" filter="blur(70px)" />

  <!-- Geometric Frame -->
  <rect x="40" y="40" width="1120" height="720" rx="20" fill="none" stroke="#4169e1" stroke-width="2" stroke-opacity="0.3" />
  <rect x="48" y="48" width="1104" height="704" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.05" />

  <!-- Top Bar / Badges -->
  <g transform="translate(80, 80)">
    <rect width="180" height="36" rx="6" fill="#4169e1" fill-opacity="0.25" stroke="#4169e1" stroke-width="1" />
    <text x="90" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="1">EVENTS FACILITY</text>
  </g>
  <g transform="translate(980, 80)">
    <rect width="140" height="36" rx="6" fill="#f7a604" fill-opacity="0.18" stroke="#f7a604" stroke-width="1" />
    <text x="70" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fcd34d" text-anchor="middle">EVT-01</text>
  </g>

  <!-- Center Decorative Icon Container -->
  <g transform="translate(600, 310)">
    <circle r="90" fill="#0a1128" stroke="#4169e1" stroke-width="3" stroke-opacity="0.6" />
    <circle r="74" fill="#4169e1" fill-opacity="0.12" />
    <g transform="translate(-24, -24) scale(2)">
      <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" stroke="#f7a604" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Title & Information Text -->
  <g transform="translate(600, 480)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Nightingale Lamp Lighting & Oath Ceremony</text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Multipurpose Hall Ceremony Honoring Incoming ANM, GNM & B.Sc. Nursing Batches</text>
  </g>

  <!-- Bottom Brand Footer -->
  <line x1="120" y1="670" x2="1080" y2="670" stroke="#4169e1" stroke-width="1" stroke-opacity="0.2" />
  <g transform="translate(600, 712)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">C.N.S. PARAMEDICAL &amp; NURSING COLLEGE</text>
    <text y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b">Samdhan, Gursahaiganj Road, Kannauj, Uttar Pradesh</text>
  </g>
</svg>